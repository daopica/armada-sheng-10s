name: Build Armada flashable (Xiaomi 10S thyme only)

on:
  workflow_dispatch:
    inputs:
      container_ref:
        description: "Armada thyme container (empty = use thyme-latest)"
        type: string
        default: ""
        required: false
      console_mode:
        description: "quiet = normal boot; verbose = detailed kernel log"
        type: choice
        options:
          - quiet
          - verbose
        default: quiet
        required: true
      publish_release:
        description: "Publish the flashable files to a GitHub Release"
        type: boolean
        default: false
        required: true

concurrency:
  group: armada-thyme-export-${{ github.ref || github.run_id }}
  cancel-in-progress: false

jobs:
  export-thyme:
    name: Export Armada for Xiaomi 10S (thyme)
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: write
      packages: read

    env:
      DEVICE: sm8250-xiaomi-thyme
      ROOT_PART: userdata

    steps:
      - name: Maximize build space
        uses: ublue-os/remove-unwanted-software@cc0becac701cf642c8f0a6613bbdaf5dc36b259e # v9
        with:
          remove-codeql: true

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install dependencies
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            curl jq pigz python3 e2fsprogs

      - name: Validate thyme profile and rootfs binding
        run: |
          set -euxo pipefail
          test "$DEVICE" = "sm8250-xiaomi-thyme"
          test "$ROOT_PART" = "userdata"
          test -r system_files/usr/lib/armada/devices/${DEVICE}.conf
          test -r system_files/usr/lib/armada/bootimg-args.${DEVICE}
          test -r system_files/usr/lib/armada/supported-dtbs.${DEVICE}
          grep -qx 'sm8250-xiaomi-thyme' \
            system_files/usr/lib/armada/supported-dtbs.${DEVICE}
          grep -Fq -- '--header_version 1' \
            system_files/usr/lib/armada/bootimg-args.${DEVICE}
          grep -Fq 'PARTLABEL=${ROOT_PART} / ext4 defaults,x-systemd.growfs 0 1' \
            .github/scripts/armada-export-flashable.sh
          grep -Fq 'CMDLINE="root=PARTLABEL=${ROOT_PART} rw rootwait console=tty0"' \
            .github/scripts/armada-export-flashable.sh
          echo "Target: ${DEVICE}"
          echo "Kernel command line root: PARTLABEL=${ROOT_PART}"
          echo "Root filesystem fstab must mount PARTLABEL=${ROOT_PART} as /."

      - name: Log in to ghcr.io
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo "$GH_TOKEN" | sudo skopeo login ghcr.io \
            -u "${GITHUB_ACTOR}" --password-stdin

      - name: Export and package thyme
        env:
          CONTAINER_REF_INPUT: ${{ inputs.container_ref }}
          MODE: ${{ inputs.console_mode }}
        run: |
          set -euxo pipefail
          REF="${CONTAINER_REF_INPUT}"
          if [ -z "$REF" ]; then
            REF="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${{ github.event.repository.name }}:thyme-latest"
          fi

          echo "Exporting ${REF} for ${DEVICE}"
          sudo bash .github/scripts/armada-export-flashable.sh \
            "$REF" \
            "${GITHUB_WORKSPACE}/output" \
            "$ROOT_PART" \
            "$MODE" \
            "$DEVICE"

          # Fail the workflow if the exporter did not bind both boot and rootfs
          # to the expected userdata partition.
          grep -Fq "root=PARTLABEL=${ROOT_PART} rw rootwait" output/MANIFEST.txt
          grep -Fq "root: PARTLABEL=${ROOT_PART} ext4 growfs" output/MANIFEST.txt
          test -s output/boot_b.img
          test -s output/rootfs.img
          test -s output/flash.sh
          test -s output/flash.bat

          sudo chown -R "$(id -u):$(id -g)" output
          ls -lh output/

      - name: Upload flashable artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: armada-sm8250-xiaomi-thyme-flashable
          path: output/*
          if-no-files-found: error
          retention-days: 14
          compression-level: 1
          overwrite: true

      - name: Split rootfs.img for GitHub Release
        run: |
          set -euxo pipefail
          cd output
          split -b 1900M rootfs.img rootfs.img.part.
          rm -f rootfs.img

          printf '%s\n' \
            '#!/bin/bash' \
            'set -euo pipefail' \
            'echo "Merging rootfs.img parts..."' \
            'cat rootfs.img.part.* > rootfs.img' \
            'sha256sum -c SHA256SUMS' \
            'echo "rootfs.img ready. Run: fastboot flash userdata rootfs.img"' \
            > merge-rootfs.sh
          chmod +x merge-rootfs.sh

          PARTS=$(ls rootfs.img.part.* | sort)
          PARTS_CMD=$(echo "$PARTS" | sed 's/ /+/g')
          printf '@echo off\nchcp 65001 >nul\necho 正在合并 rootfs.img 分卷...\ncopy /b %s rootfs.img\necho 合并完成: rootfs.img\npause\n' \
            "$PARTS_CMD" > merge-rootfs.bat

          sha256sum rootfs.img.part.* > SHA256SUMS.parts
          ls -lh

      - name: Create thyme Release
        if: ${{ inputs.publish_release }}
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: sm8250-xiaomi-thyme-flashable
          name: "Armada Xiaomi 10S (thyme) flashable"
          body: |
            ## Armada for Xiaomi 10S (sm8250-xiaomi-thyme)

            Single-system Fastboot installation. Android userdata is erased.

            **Root filesystem binding**
            - Kernel cmdline: `root=PARTLABEL=userdata rw rootwait`
            - `/etc/fstab`: `PARTLABEL=userdata / ext4 defaults,x-systemd.growfs 0 1`
            - Root filesystem is written to the `userdata` partition.

            **Files**
            - `boot_b.img` — Android boot image, kernel + initramfs + thyme DTB
            - `rootfs.img.part.*` — split ext4 root filesystem
            - `merge-rootfs.sh` / `merge-rootfs.bat` — reassemble rootfs.img
            - `flash.sh` / `flash.bat` — Fastboot installation helpers
            - `MANIFEST.txt`, `SHA256SUMS`, `SHA256SUMS.parts` — build metadata/checksums

            Merge the rootfs parts before running the flash script.
            Back up data first. Bootloader must be unlocked.
          files: output/*
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
